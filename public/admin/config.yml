# Decap CMS for kuk-sool-won-griepentrog.de (Astro).
# Login: GitHub account with write access to the repo, via Netlify as OAuth provider (no Netlify Identity).
# Local editing without login: `npm run cms` in a second terminal next to `npm run dev`, then open /admin/.

backend:
  name: github
  repo: ksw-admin/ksw-website
  # IMPORTANT: astro-redesign until the merge. main still holds the old Eleventy site,
  # and files written in the new layout would break it. Switch to main when merging.
  branch: astro-redesign
  base_url: https://api.netlify.com
  auth_endpoint: auth
  commit_messages:
    create: 'Neu: {{collection}} „{{slug}}“'
    update: 'Geändert: {{collection}} „{{slug}}“'
    delete: 'Gelöscht: {{collection}} „{{slug}}“'
    uploadMedia: 'Bild hochgeladen: {{path}}'
    deleteMedia: 'Bild gelöscht: {{path}}'

local_backend: true
locale: de

# Drafts: changes are saved as "Entwurf", moved to "In Prüfung" / "Bereit" and only go live with "Veröffentlichen".
# Each draft is a branch + pull request; CI checks it and Netlify builds a deploy preview, which the CMS links as
# "Vorschau ansehen" (exact live rendering). The local mode (`npm run cms`) has no drafts and saves directly.
publish_mode: editorial_workflow
show_preview_links: true
site_url: https://www.kuk-sool-won-griepentrog.de
logo_url: /images/Logo.svg

# New file names without umlauts and special characters (gurtelprufung-2026, not gürtelprüfung). Old files keep their names.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Default upload folder (only used where a collection sets none). Content photos are stored next to their
# entries instead (media_folder: images per collection) and optimized by Astro at build time.
media_folder: public/images
public_folder: /images

# Translations: German is the main language. An English version holds ONLY the text fields (marked i18n: true);
# date, type, place, medals, photos and galleries stay in the German entry and the English page uses them.
# Files: src/content/<collection>/de/<name>.md and .../en/<name>.md. Untranslated English pages show German
# content with an English note. An English entry without title is ignored by the site.
i18n:
  structure: multiple_folders
  locales: [de, en]
  default_locale: de

collections:
  # ---------------------------------------------------------------- Beiträge
  - name: news
    label: Aktuelles
    label_singular: Beitrag
    description: >-
      Turniere, Prüfungen, Seminare, Vereinsleben. Kurze Beiträge (ein, zwei Sätze und ein Foto) stehen komplett in der Liste,
      lange Beiträge bekommen eine eigene Seite.
    folder: src/content/news
    i18n: true
    # "Live ansehen": long posts open their page, short ones forward to their entry in the list.
    preview_path: 'aktuelles/{{slug}}/'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{title}}'
    # Uploads go next to the entries (images/ beside the .md file); the site makes small WebP versions at build time.
    media_folder: images
    public_folder: images
    summary: '{{date | date("DD.MM.YYYY")}}  {{title}}'
    # Decap 3.17 has no default sort order: click "Datum" in the list to sort newest first.
    sortable_fields: [date, title]
    view_groups:
      - { label: Jahr, field: date, pattern: '\d{4}' }
    view_filters:
      - { label: Turniere, field: kind, pattern: Turnier }
      - { label: Prüfungen, field: kind, pattern: Prüfung }
      - { label: Seminare, field: kind, pattern: Seminar }
      - { label: Verein, field: kind, pattern: Verein }
      - { label: Mit Medaillen, field: medals.gold, pattern: '[1-9]' }
      - { label: Ausgeblendet, field: featured, pattern: 'false' }
    fields: &postFields
      - { label: Titel, name: title, widget: string, i18n: true }
      - { label: Auf der Website anzeigen, name: featured, widget: boolean, default: true, hint: 'Aus: Der Beitrag bleibt gespeichert, erscheint aber nirgends (Liste, Startseite, eigene Seite, Google).' }
      - { label: Datum, name: date, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: YYYY-MM-DD, picker_utc: true, default: '{{now}}', hint: 'Tag des Turniers oder der Prüfung. Bestimmt die Reihenfolge auf der Website.' }
      - label: Art
        name: kind
        widget: select
        required: false
        options: [Turnier, Prüfung, Seminar, Verein]
      - { label: Ort, name: place, widget: string, required: false, hint: z.B. Arnsberg }
      - { label: Kurztext, name: description, widget: text, i18n: true, hint: 'Ein, zwei Sätze. Steht in der Liste, bei Google und in der Linkvorschau (WhatsApp usw.). Den ausführlichen Bericht unten bei „Bericht“ schreiben.' }
      - { label: Foto, name: image, widget: image, required: false, choose_url: false }
      - { label: Bildbeschreibung, name: image_text, widget: string, required: false, i18n: true, hint: 'Was ist auf dem Foto zu sehen? (für Screenreader und Linkvorschau)' }
      - label: Medaillen und Platzierungen
        name: medals
        widget: object
        required: false
        collapsed: true
        hint: Nur bei Turnieren. Die Website zählt daraus die Platzierungen der Saison.
        fields:
          - { label: Gold (1. Platz), name: gold, widget: number, value_type: int, min: 0, default: 0 }
          - { label: Silber (2. Platz), name: silver, widget: number, value_type: int, min: 0, default: 0 }
          - { label: Bronze (3. Platz), name: bronze, widget: number, value_type: int, min: 0, default: 0 }
          - { label: Weitere Platzierungen, name: other, widget: number, value_type: int, min: 0, default: 0 }
      - label: Eigene Seite
        name: page
        widget: select
        required: false
        default: auto
        options:
          - { label: 'Automatisch (eigene Seite nur bei langem Text)', value: auto }
          - { label: 'Ja, immer eigene Seite', value: ja }
          - { label: 'Nein, nur in der Liste', value: nein }
      - { label: Bericht (optional), name: body, widget: markdown, required: false, i18n: true, buttons: [bold, italic, link, heading-two, bulleted-list, numbered-list], editor_components: [image], hint: 'Ausführlicher Bericht mit Überschriften und Listen (z.B. Ergebnisse). Ein Beitrag mit Bericht bekommt automatisch eine eigene Seite.' }

  - name: articles
    label: Artikel (alt)
    label_singular: Artikel
    description: Ältere Artikel mit eigener Seite unter /articles/. Neue Beiträge bitte unter „Aktuelles“ anlegen.
    folder: src/content/articles
    i18n: true
    preview_path: 'articles/{{slug}}/'
    create: false
    slug: '{{year}}-{{month}}-{{day}}-{{title}}'
    # Uploads go next to the entries (images/ beside the .md file); the site makes small WebP versions at build time.
    media_folder: images
    public_folder: images
    summary: '{{date | date("DD.MM.YYYY")}}  {{title}}'
    # Decap 3.17 has no default sort order: click "Datum" in the list to sort newest first.
    sortable_fields: [date, title]
    fields: *postFields

  # ---------------------------------------------------------------- Seiten
  - name: disciplines
    label: Kampfkunst-Seiten
    label_singular: Seite
    description: Die Seiten Kuk Sool Won und Tai Chi. Trainingszeiten stehen unter „Einstellungen › Trainingszeiten“.
    folder: src/content/disciplines
    i18n: true
    preview_path: 'category/{{slug}}/'
    create: false
    delete: false
    slug: '{{slug}}'
    # Uploads go next to the entries (images/ beside the .md file); the site makes small WebP versions at build time.
    media_folder: images
    public_folder: images
    fields:
      - { label: Titel, name: title, widget: string, i18n: true }
      - { label: Kurzbeschreibung (für Google), name: description, widget: string, required: false, i18n: true }
      - { label: Text, name: body, widget: markdown, i18n: true }
      - label: Bildergalerie
        name: galleryImages
        widget: list
        required: false
        summary: '{{fields.link_text}}'
        fields:
          - { label: Vorschaubild, name: image, widget: image, choose_url: false }
          - { label: Titel, name: link_text, widget: string, hint: z.B. Gürtelprüfung 2026 }
          - { label: Link zum Album (Flickr), name: link, widget: string, pattern: ['^https?://', 'Bitte eine vollständige Adresse mit https:// eingeben'] }

  - name: faq
    label: FAQ
    label_singular: Frage
    description: >-
      Häufige Fragen (Seite /faq/). Neue Fragen von Besuchern kommen über das Formular unter der FAQ ins
      Netlify-Dashboard und per E-Mail; erst wenn hier eine Antwort angelegt wird, erscheint die Frage auf der Website.
    folder: src/content/faq
    i18n: true
    preview_path: 'faq/#{{slug}}'
    create: true
    slug: '{{question}}'
    identifier_field: question
    summary: '{{order}}  {{question}}'
    sortable_fields: [order, question]
    fields:
      - { label: Frage, name: question, widget: string, i18n: true }
      - { label: Reihenfolge, name: order, widget: number, value_type: int, default: 100, required: false, hint: 'Kleine Zahlen stehen oben (10, 20, 30 …; Lücken lassen Platz zum Einsortieren).' }
      - { label: Antwort, name: body, widget: markdown, i18n: true, buttons: [bold, italic, link, bulleted-list], editor_components: [], hint: 'Kurz und konkret. Links auf andere Seiten der Website sind gut (z.B. /#schedule für den Wochenplan).' }

  - name: pages
    label: Rechtliches
    files:
      - label: Impressum
        name: impressum
        file: src/content/pages/de/impressum.md
        preview_path: other/impressum/
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Text, name: body, widget: markdown }
      - label: Datenschutz
        name: datenschutz
        file: src/content/pages/de/datenschutz.md
        preview_path: other/datenschutz/
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Text, name: body, widget: markdown }

  - name: sponsors
    label: Sponsoren
    label_singular: Sponsor
    folder: src/content/sponsors
    preview_path: other/sponsoren/
    create: true
    slug: '{{name}}'
    # Uploads go next to the entries (images/ beside the .md file); the site makes small WebP versions at build time.
    media_folder: images
    public_folder: images
    identifier_field: name
    summary: '{{name}}'
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Straße, name: adresse_1, widget: string, required: false }
      - { label: PLZ und Ort, name: adresse_2, widget: string, required: false }
      - { label: Telefon, name: telefon, widget: string, required: false }
      - { label: Website, name: link, widget: string, required: false }
      - { label: Logo, name: image, widget: image, required: false, choose_url: false }
      - { label: Logo-Beschreibung, name: image_text, widget: string, required: false }

  # ---------------------------------------------------------------- Startseite
  - name: home
    label: Startseite
    i18n:
      structure: single_file
      locales: [de, en]
      default_locale: de
    files:
      - label: Startseite
        name: home
        file: src/content/home.json
        format: json
        i18n: true
        description: Texte und Fotos der Startseite. Trainingszeiten, Beiträge, Kontaktdaten und Qualifikationen werden an ihrer eigenen Stelle gepflegt. Leere englische Felder zeigen den deutschen Text.
        media_folder: images
        public_folder: images
        fields:
          - { label: Überschrift, name: headline, widget: string, i18n: true }
          - { label: Einleitung, name: lead, widget: text, i18n: true }
          - { label: Beschreibung für Google und Linkvorschau, name: description, widget: text, i18n: true }
          - { label: Großes Foto, name: photo, widget: image, i18n: duplicate, choose_url: false }
          - { label: Großes Foto – Beschreibung (Screenreader), name: photoAlt, widget: string, i18n: true }
          - { label: Großes Foto – Bildunterschrift, name: photoCaption, widget: string, i18n: true }
          - { label: Text Kuk Sool Won, name: kswText, widget: text, i18n: true, hint: 'Leerzeile = neuer Absatz. Zahlen und Altersgruppen kommen aus den Trainingszeiten.' }
          - { label: Text Tai Chi und Atemschulung, name: taichiText, widget: text, i18n: true, hint: 'Leerzeile = neuer Absatz. Tage und Uhrzeiten kommen aus den Trainingszeiten.' }
          - { label: Überschrift über dem Video, name: videoHeading, widget: string, i18n: true }
          - { label: Überschrift Meister, name: masterHeading, widget: string, i18n: true, hint: 'Steht über dem Abschnitt mit Foto und Qualifikationen, z.B. „Der Meister“.' }
          - { label: Einleitung Meister, name: masterIntro, widget: text, i18n: true }
          - { label: Foto Meister, name: masterPhoto, widget: image, i18n: duplicate, choose_url: false }
          - { label: Foto Meister – Beschreibung (Screenreader), name: masterPhotoAlt, widget: string, i18n: true }
          - { label: Foto Meister – Bildunterschrift, name: masterPhotoCaption, widget: string, i18n: true }
          - { label: Überschrift Kontakt, name: contactHeading, widget: string, i18n: true }
          - { label: Einleitung Kontakt, name: contactIntro, widget: text, i18n: true }

  # ---------------------------------------------------------------- Einstellungen
  - name: settings
    label: Einstellungen
    editor: { preview: false }
    files:
      - label: Trainingszeiten
        name: schedule
        file: src/content/schedule.json
        format: json
        description: Eine Zeile pro Gruppe. Wird für den Wochenplan, die Altersauswahl und die Seiten Kuk Sool Won / Tai Chi benutzt.
        fields:
          - label: Gruppen
            name: slots
            widget: list
            summary: '{{fields.id}}: {{fields.from}}–{{fields.to}}'
            fields:
              - { label: Kennung, name: id, widget: string, hint: 'Eindeutig, ohne Leerzeichen, z.B. ksw-9-11' }
              - label: Kampfkunst
                name: discipline
                widget: select
                options: [{ label: Kuk Sool Won, value: kuksoolwon }, { label: Tai Chi, value: taichi }]
              - label: Tage
                name: days
                widget: select
                multiple: true
                options:
                  - { label: Montag, value: mo }
                  - { label: Dienstag, value: di }
                  - { label: Mittwoch, value: mi }
                  - { label: Donnerstag, value: do }
                  - { label: Freitag, value: fr }
                  - { label: Samstag, value: sa }
                  - { label: Sonntag, value: so }
              - { label: Von, name: from, widget: string, pattern: ['^\d{2}:\d{2}$', 'Format HH:MM, z.B. 18:30'] }
              - { label: Bis, name: to, widget: string, pattern: ['^\d{2}:\d{2}$', 'Format HH:MM, z.B. 19:30'] }
              - { label: Alter von, name: ageMin, widget: number, value_type: int, required: false }
              - { label: Alter bis, name: ageMax, widget: number, value_type: int, required: false, hint: 'Leer = „ab … Jahre“ (keine Obergrenze)' }
              - { label: Hinweis, name: note, widget: string, required: false }

      - label: Trainingsausfälle
        name: closures
        file: src/content/closures.json
        format: json
        description: >-
          Hinweis „Kein Training“ oben auf jeder Seite, ab 14 Tage vorher bis zum letzten Tag. Die Termine fallen auch
          im Kalender-Abo weg. Kurzfristig (heute): „Von“ = heute, „Bis“ leer lassen. Vergangene Ausfälle verschwinden
          von selbst und können gelöscht werden.
        fields:
          - label: Ausfälle
            name: items
            widget: list
            required: false
            summary: '{{fields.from}} – {{fields.to}}: {{fields.text}}'
            fields:
              - { label: Von, name: from, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: YYYY-MM-DD, picker_utc: true }
              - { label: Bis (leer = nur ein Tag), name: to, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: YYYY-MM-DD, picker_utc: true, required: false }
              - { label: Text, name: text, widget: string, hint: 'z.B. „Herbstferien“ oder „Halle belegt“. Steht nach „Kein Training vom … bis …:“.' }
              - { label: Text Englisch (optional), name: text_en, widget: string, required: false }
              - label: Betrifft
                name: groups
                widget: select
                default: alle
                options: [{ label: Alle Gruppen, value: alle }, { label: Nur Kuk Sool Won, value: kuksoolwon }, { label: Nur Tai Chi, value: taichi }]

      - label: Kontakt und Allgemeines
        name: site
        file: src/content/site.json
        format: json
        fields:
          - { label: Name der Schule, name: name, widget: string }
          - { label: Kurzname, name: shortName, widget: string }
          - { label: Beschreibung (für Google), name: description, widget: string }
          - { label: Ansprechpartner, name: contactName, widget: string }
          - { label: E-Mail, name: email, widget: string }
          - label: Telefonnummern
            name: phones
            widget: list
            summary: '{{fields.label}} {{fields.value}}'
            fields:
              - { label: Bezeichnung, name: label, widget: string, hint: z.B. Mobil }
              - { label: Nummer, name: value, widget: string }
              - { label: Hauptnummer (groß auf der Seite), name: primary, widget: boolean, required: false, default: false }
          - label: Trainingshalle
            name: hall
            widget: object
            fields:
              - { label: Straße, name: street, widget: string }
              - { label: Zusatz, name: note, widget: string, required: false }
              - { label: PLZ und Ort, name: city, widget: string }
              - { label: Link zur Karte (OpenStreetMap), name: osm, widget: string }
          - label: Meister
            name: master
            widget: object
            fields:
              - { label: Dan-Grad, name: dan, widget: number, value_type: int }
              - { label: Kampfkunst seit, name: since, widget: number, value_type: int }
              - label: Qualifikationen
                name: credentials
                widget: list
                summary: '{{fields.label}}: {{fields.value}}'
                fields:
                  - { label: Bereich, name: label, widget: string, hint: z.B. Kuk Sool Won }
                  - { label: Qualifikation, name: value, widget: string, hint: z.B. 5. Dan }
          - label: Social Media
            name: social
            widget: list
            required: false
            summary: '{{fields.name}}'
            fields:
              - { label: Name, name: name, widget: string, hint: z.B. Instagram }
              - { label: Adresse, name: url, widget: string }
              - { label: Linktext, name: label, widget: string, required: false, hint: 'z.B. „Fotoalben auf Flickr“' }
          - label: Website-Credit (Fußzeile)
            name: credit
            widget: object
            collapsed: true
            fields:
              - { label: Text, name: text, widget: string, default: 'Website: Jonah L.' }
              - { label: Link, name: url, widget: string, required: false, pattern: ['^(https?://.+)?$', 'Vollständige Adresse mit https://'], hint: 'Optional, z.B. ein LinkedIn-Profil. Leer = kein Link.' }
          - { label: Kalender-Abo der Trainingszeiten, name: calendar, widget: boolean, default: true, required: false, hint: 'An: Links unter dem Wochenplan (Google Kalender, iPhone/Mac/Outlook) und die Kalender-Dateien unter /kalender/. Aus: nichts davon, auch die FAQ-Antwort zum Kalender ist ausgeblendet. Ausfälle stehen weiter oben auf der Website.' }
          - { label: Kontaktformular auf der Kontaktseite, name: contactForm, widget: boolean, default: false, required: false, hint: 'An: Unter Telefon und Adresse steht ein Formular (Name, E-Mail oder Telefon, Nachricht). Nachrichten: Netlify › Forms › kontakt, Benachrichtigung dort einstellen.' }
          - { label: Fragen-Formular auf der FAQ-Seite, name: questionForm, widget: boolean, default: false, required: false, hint: 'An: Besucher können unter der FAQ eine Frage senden (Netlify › Forms, Benachrichtigung dort einstellen). Aus: dort stehen stattdessen Telefon und E-Mail.' }
          - label: Besucherstatistik
            name: analytics
            widget: object
            collapsed: true
            fields:
              - { label: Cloudflare Web Analytics Token, name: cloudflareToken, widget: string, required: false, pattern: ['^([0-9a-f]{32})?$', '32 Zeichen (0-9, a-f) aus dem Cloudflare-Dashboard'], hint: 'Cloudflare-Dashboard › Analytics & Logs › Web Analytics › Site hinzufügen › Token. Leer = keine Statistik.' }
          - label: Video auf der Startseite
            name: video
            widget: object
            required: false
            fields:
              - { label: YouTube-ID, name: youtubeId, widget: string, hint: 'Die 11 Zeichen nach „watch?v=“ in der YouTube-Adresse' }
              - { label: Titel, name: title, widget: string, hint: 'Für Screenreader; die Überschrift über dem Video steht unter „Startseite“.' }
